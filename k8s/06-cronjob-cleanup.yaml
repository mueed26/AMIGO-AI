# CronJob: every 10 minutes, start a short-lived pod that marks stuck runs as failed, then exits.
# A run gets stuck when its worker pod dies mid-run (try: kubectl delete pod <worker> during a run).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-stuck-runs
  namespace: amigo
  labels:
    app.kubernetes.io/name: amigo
    app.kubernetes.io/component: cleanup
    app.kubernetes.io/part-of: amigo-ai
spec:
  # Standard cron syntax: minute hour day month weekday. "*/10" = every 10 minutes.
  schedule: "*/10 * * * *"
  # Never start a new cleanup while the previous one is still running.
  concurrencyPolicy: Forbid
  # Keep the last few finished Jobs so you can read their logs, delete older ones.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Retry a failed cleanup up to 2 times, and give up if a single attempt runs over 2 minutes.
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: amigo
            app.kubernetes.io/component: cleanup
        spec:
          # Jobs run to completion: restart the container only if it fails.
          restartPolicy: OnFailure
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          containers:
            - name: cleanup
              # Same image as the app, running a script instead of the web server.
              image: amigo-ai:1.1.0
              imagePullPolicy: IfNotPresent
              command: ["node", "scripts/cleanup-stuck-runs.mjs"]
              envFrom:
                - secretRef:
                    name: amigo-secrets
                - configMapRef:
                    name: amigo-config
              env:
                - name: STUCK_AFTER_MINUTES
                  value: "30"
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
              securityContext:
                allowPrivilegeEscalation: false
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
