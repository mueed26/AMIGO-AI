# Self-hosted Inngest: the queue, scheduler and retry engine.
# It calls the worker Service (/api/inngest) to run each step, which spreads steps across all worker pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inngest
  namespace: amigo
  labels:
    app.kubernetes.io/name: inngest
    app.kubernetes.io/part-of: amigo-ai
spec:
  # Dev-server mode keeps its state in memory, so it must stay at exactly one copy.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inngest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inngest
        app.kubernetes.io/part-of: amigo-ai
    spec:
      # Kubernetes normally injects env vars for every Service in the namespace (e.g. INNGEST_PORT=tcp://10.x.x.x:8288).
      # Inngest reads its own settings from INNGEST_* variables, so those would break it. We use DNS names instead.
      enableServiceLinks: false
      containers:
        - name: inngest
          image: inngest/inngest:v1.49.0
          args:
            - inngest
            - dev
            - -u
            - http://amigo-worker.amigo.svc.cluster.local/api/inngest
            - --no-discovery
          ports:
            - name: http
              containerPort: 8288
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Stable in-cluster address for Inngest: http://inngest.amigo.svc.cluster.local:8288
apiVersion: v1
kind: Service
metadata:
  name: inngest
  namespace: amigo
  labels:
    app.kubernetes.io/name: inngest
    app.kubernetes.io/part-of: amigo-ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inngest
  ports:
    - name: http
      port: 8288
      targetPort: http
