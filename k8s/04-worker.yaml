# Worker: same image as web, but this is what Inngest calls to actually run agents.
# Kept separate so long agent runs never slow down the UI, and so it can be scaled on its own (KEDA, next step).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amigo-worker
  namespace: amigo
  labels:
    app.kubernetes.io/name: amigo
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: amigo-ai
spec:
  # No "replicas" here on purpose: KEDA (07-keda-autoscaling.yaml) owns the worker count.
  # If this file also set replicas, every kubectl apply would reset it and fight the autoscaler.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: amigo
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amigo
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: amigo-ai
    spec:
      # Turn off auto-injected Service env vars (INNGEST_PORT etc.), they clash with the Inngest SDK's own INNGEST_* settings.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      # Give an in-progress agent run time to finish before the pod is stopped during an update or scale-down.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: amigo-ai:1.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: amigo-secrets
            - configMapRef:
                name: amigo-config
          env:
            - name: SERVICE_NAME
              value: "amigo-worker"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
          # More CPU/memory headroom than web: agent runs call LLMs and tools and hold more data in memory.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
# Internal-only address Inngest uses to reach the workers: http://amigo-worker.amigo.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: amigo-worker
  namespace: amigo
  labels:
    app.kubernetes.io/name: amigo
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: amigo-ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: amigo
    app.kubernetes.io/component: worker
  ports:
    - name: http
      port: 80
      targetPort: http
