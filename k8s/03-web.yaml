# Web: the Next.js app your browser talks to (pages + API routes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amigo-web
  namespace: amigo
  labels:
    app.kubernetes.io/name: amigo
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: amigo-ai
spec:
  # Two copies: if one crashes or is being updated, the other keeps serving.
  replicas: 2
  # Rolling update: start one new pod before stopping an old one, so there's no downtime.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # The selector must match the pod labels below, or the Deployment can't find its pods.
  selector:
    matchLabels:
      app.kubernetes.io/name: amigo
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amigo
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: amigo-ai
    spec:
      # Turn off auto-injected Service env vars (INNGEST_PORT etc.), they clash with the Inngest SDK's own INNGEST_* settings.
      enableServiceLinks: false
      # Matches the non-root user created in the Dockerfile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: web
          # A fixed version tag, never "latest". The image is loaded into minikube from your local Docker.
          image: amigo-ai:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # Settings come from two places. When a key is in both, the later one (the ConfigMap) wins,
          # which overrides INNGEST_DEV=1 from .env with the in-cluster Inngest address.
          envFrom:
            - secretRef:
                name: amigo-secrets
            - configMapRef:
                name: amigo-config
          env:
            - name: SERVICE_NAME
              value: "amigo-web"
            # The pod's own name (e.g. amigo-web-7d9f-x2k4q), so every log line says which replica wrote it.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
          # requests = what the scheduler reserves for this pod; limits = the most it may ever use.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Liveness: if /api/health stops answering 3 times in a row, Kubernetes restarts the container.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: if /api/ready fails (database unreachable), the pod gets no traffic until it passes again.
          # 5 s timeout because Neon can take a few seconds to wake from a cold start.
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
# Stable address in front of the web pods; spreads requests across both replicas.
apiVersion: v1
kind: Service
metadata:
  name: amigo-web
  namespace: amigo
  labels:
    app.kubernetes.io/name: amigo
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: amigo-ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: amigo
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
